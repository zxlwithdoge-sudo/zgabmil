[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abmil-oct"
version = "1.0.0"
description = "Attention-based multiple instance learning for OCT brain image classification"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
    "matplotlib>=3.7,<3.8",
    "numpy>=1.24,<1.25",
    "opencv-python-headless>=4.7,<4.8",
    "Pillow>=9.4,<10",
    "scikit-image>=0.20,<0.21",
    "scikit-learn>=1.2,<1.3",
    "scipy>=1.10,<1.11",
    "torch>=1.13,<1.14",
    "torchvision>=0.14,<0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["abmil_oct*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
